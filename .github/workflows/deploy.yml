name: CI/CD - Test & Deploy to AWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.9'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # TEST JOB: Run pytest with mongomock
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Run linting (pylint/flake8)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install flake8 pylint
          flake8 src/ --max-line-length=120 --count --show-source --statistics
      
      - name: Run tests with pytest (using mongomock)
        working-directory: backend
        run: |
          # Set testing environment
          export FLASK_ENV=testing
          export LOG_LEVEL=WARNING
          
          # Run tests with coverage
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY JOB: Deploy to AWS Lambda using Serverless Framework
  # Only runs on main branch and only if test job succeeds
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js (for Serverless Framework)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Serverless Framework
        run: |
          npm install -g serverless
          npm install -g serverless-python-requirements
      
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set AWS SSM Parameters for Production
        run: |
          echo "Setting up AWS SSM Parameters for production deployment..."
          
          aws ssm put-parameter \
            --name "/heavy-freight/prod/JWT_SECRET_KEY" \
            --value "${{ secrets.JWT_SECRET_KEY }}" \
            --type "SecureString" \
            --overwrite \
            --region ${{ env.AWS_REGION }} || true
          
          aws ssm put-parameter \
            --name "/heavy-freight/prod/MONGO_URI" \
            --value "${{ secrets.MONGO_URI }}" \
            --type "SecureString" \
            --overwrite \
            --region ${{ env.AWS_REGION }} || true
          
          aws ssm put-parameter \
            --name "/heavy-freight/prod/CORS_ORIGIN" \
            --value "${{ secrets.CORS_ORIGIN }}" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }} || true
          
          aws ssm put-parameter \
            --name "/heavy-freight/prod/JWT_ALGORITHM" \
            --value "HS256" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }} || true
          
          aws ssm put-parameter \
            --name "/heavy-freight/prod/JWT_EXPIRATION_HOURS" \
            --value "8" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }} || true
          
          aws ssm put-parameter \
            --name "/heavy-freight/prod/BCRYPT_ROUNDS" \
            --value "12" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }} || true
          
          echo "✓ AWS SSM Parameters configured successfully"
      
      - name: Deploy via Serverless Framework
        working-directory: backend
        run: |
          echo "Starting deployment to AWS Lambda (production)..."
          
          serverless deploy \
            --stage prod \
            --region ${{ env.AWS_REGION }} \
            --verbose
          
          echo "✓ Deployment to AWS Lambda completed"
      
      - name: Get Deployment Info
        working-directory: backend
        run: |
          echo "Retrieving deployment information..."
          serverless info --stage prod --region ${{ env.AWS_REGION }}
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Heavy Freight Platform Successfully Deployed!"
          echo ""
          echo "Deployment Details:"
          echo "  • Environment: Production (prod)"
          echo "  • Region: ${{ env.AWS_REGION }}"
          echo "  • Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Branch: ${{ github.ref }}"
          echo ""
          echo "Next Steps:"
          echo "  1. Check AWS CloudWatch for logs"
          echo "  2. Test the API endpoint"
          echo "  3. Monitor performance and errors"

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICATION JOB: Notify on failures
  # ═══════════════════════════════════════════════════════════════════════════
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()
    
    steps:
      - name: Check test failure
        if: needs.test.result == 'failure'
        run: |
          echo "❌ Tests failed. Deployment will not proceed."
          exit 1
      
      - name: Check deploy failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment to AWS failed. Please check the logs."
          exit 1
