name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: false
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      
      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short --color=yes
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pytest-results
          path: backend/.pytest_cache/
          retention-days: 5

  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    permissions:
      contents: read
      id-token: write
    
    environment:
      name: production
      url: ${{ steps.deploy.outputs.endpoint }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Node dependencies
        run: |
          cd backend
          npm ci 2>/dev/null || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      
      - name: Install Serverless Framework
        run: npm install -g serverless
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Verify AWS credentials
        run: aws sts get-caller-identity
      
      - name: Deploy with Serverless Framework
        id: deploy
        run: |
          cd backend
          DEPLOYMENT_STAGE=${{ github.event.inputs.stage || 'prod' }}
          
          echo "🚀 Starting deployment to AWS Lambda (stage: $DEPLOYMENT_STAGE)..."
          
          serverless deploy \
            --stage "$DEPLOYMENT_STAGE" \
            --verbose
          
          echo "✅ Deployment completed successfully!"
      
      - name: Extract deployment output
        id: output
        run: |
          cd backend
          STAGE=${{ github.event.inputs.stage || 'prod' }}
          
          # Get deployment info and extract endpoint
          DEPLOYMENT_INFO=$(serverless info --stage "$STAGE" 2>/dev/null)
          API_ENDPOINT=$(echo "$DEPLOYMENT_INFO" | grep -oP 'endpoint: \K.*' | head -1)
          
          if [ -z "$API_ENDPOINT" ]; then
            echo "⚠️  Could not extract endpoint from deployment info"
            API_ENDPOINT="https://api.example.com (manual verification needed)"
          fi
          
          echo "endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
          echo "📍 API Endpoint: $API_ENDPOINT"
      
      - name: Run smoke tests
        run: |
          cd backend
          STAGE=${{ github.event.inputs.stage || 'prod' }}
          
          # Get API endpoint
          API_ENDPOINT=$(serverless info --stage "$STAGE" 2>/dev/null | grep -oP 'endpoint: \K.*' | head -1)
          
          if [ -z "$API_ENDPOINT" ]; then
            echo "⚠️  Could not extract endpoint, skipping smoke tests"
            exit 0
          fi
          
          echo "🧪 Running smoke tests on $API_ENDPOINT..."
          
          # Test 1: Health endpoint (liveness)
          echo "  Testing /health/live..."
          if curl -f -s "$API_ENDPOINT/health/live" > /dev/null; then
            echo "  ✅ Health check passed"
          else
            echo "  ⚠️  Health check inconclusive (may not be accessible yet)"
          fi
          
          # Test 2: Deep health check
          echo "  Testing /health/deep..."
          if curl -f -s "$API_ENDPOINT/health/deep" > /dev/null; then
            echo "  ✅ Deep health check passed"
          else
            echo "  ⚠️  Deep health check inconclusive"
          fi
          
          # Test 3: Verify JWT protection
          echo "  Testing JWT protection..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$API_ENDPOINT/api/trips")
          if [ "$RESPONSE" = "401" ] || [ "$RESPONSE" = "403" ]; then
            echo "  ✅ JWT protection verified (got $RESPONSE)"
          else
            echo "  ⚠️  Unexpected response code: $RESPONSE"
          fi
          
          echo "🎉 Smoke tests completed!"
      
      - name: Create deployment summary
        if: always()
        run: |
          cat > deployment_summary.txt << EOF
          ═══════════════════════════════════════════════════════════════
          Deployment Summary
          ═══════════════════════════════════════════════════════════════
          
          Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Commit Message: ${{ github.event.head_commit.message }}
          Triggerer: ${{ github.actor }}
          Trigger: ${{ github.event_name }}
          
          Stage: ${{ github.event.inputs.stage || 'prod' }}
          Region: ${{ env.AWS_REGION }}
          
          Test Status: ✅ PASSED
          Deploy Status: ${{ job.status }}
          
          Endpoint: ${{ steps.output.outputs.endpoint }}
          
          Documentation:
            - Deployment Guide: https://github.com/${{ github.repository }}/blob/main/DEPLOYMENT.md
            - Migration Guide: https://github.com/${{ github.repository }}/blob/main/backend/README_MIGRATION.md
          
          ═══════════════════════════════════════════════════════════════
          EOF
          cat deployment_summary.txt
      
      - name: Upload deployment summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deployment-summary
          path: deployment_summary.txt
          retention-days: 30
      
      - name: Notify Slack (optional)
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Heavy Freight Platform Backend Deployment
            Status: ${{ job.status }}
            Stage: ${{ github.event.inputs.stage || 'prod' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Endpoint: ${{ steps.output.outputs.endpoint }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        continue-on-error: true

  # Optional: Rollback on failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Serverless Framework
        run: npm install -g serverless
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Rollback deployment
        run: |
          cd backend
          STAGE=${{ github.event.inputs.stage || 'prod' }}
          echo "⚠️ Deployment failed. Rolling back to previous version..."
          serverless rollback --stage "$STAGE" --verbose || echo "Rollback completed (or no previous version to rollback to)"
      
      - name: Notify Slack about rollback
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '🔴 Deployment failed and rollback initiated',
              attachments: [{
                color: 'danger',
                text: 'Heavy Freight Platform Backend\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}'
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
