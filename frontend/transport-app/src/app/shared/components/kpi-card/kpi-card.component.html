<div class="card-brutal p-6 flex flex-col">
  <div class="flex items-start justify-between mb-4">
    <div class="text-3xl">{{ icon }}</div>
    <div [ngClass]="getColorClasses()" class="w-12 h-12 rounded-lg flex items-center justify-center">
      <span class="text-lg">→</span>
    </div>
  </div>
  <p class="text-gray-600 text-sm font-medium mb-1">{{ label }}</p>
  <p class="text-3xl font-bold text-darkBlue">{{ value }}</p>
  <p *ngIf="unit" class="text-xs text-gray-500 mt-1">{{ unit }}</p>
</div>
