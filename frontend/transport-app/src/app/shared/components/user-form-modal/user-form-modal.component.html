<div class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
  <div class="bg-white rounded shadow-lg w-96 p-4">
    <h3 class="text-lg font-semibold mb-3">{{ user ? 'Editar Usuario' : 'Crear Usuario' }}</h3>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-2">
        <label class="block text-sm">Nombre</label>
        <input formControlName="nombre" class="w-full px-2 py-1 border rounded" />
        <div *ngIf="f.nombre.invalid && (f.nombre.dirty || f.nombre.touched)" class="text-red-500 text-xs">Nombre requerido (mín 3).</div>
      </div>

      <div class="mb-2">
        <label class="block text-sm">Email</label>
        <input formControlName="email" class="w-full px-2 py-1 border rounded" />
        <div *ngIf="f.email.invalid && (f.email.dirty || f.email.touched)" class="text-red-500 text-xs">Email inválido.</div>
      </div>

      <div *ngIf="isCreate" class="mb-2">
        <label class="block text-sm">Contraseña</label>
        <input type="password" formControlName="password" class="w-full px-2 py-1 border rounded" />
      </div>

      <div *ngIf="isCreate" class="mb-2">
        <label class="block text-sm">Confirmar contraseña</label>
        <input type="password" formControlName="confirmPassword" class="w-full px-2 py-1 border rounded" />
      </div>

      <div class="flex justify-end mt-4">
        <button type="button" class="mr-2 px-3 py-1 border rounded" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-gold px-3 py-1" [disabled]="form.invalid">Guardar Usuario</button>
      </div>
    </form>
  </div>
</div>
