service: heavy-freight-platform-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  
  # Memory and timeout settings
  memorySize: 512
  timeout: 30
  
  # HTTP API (v2) Configuration - Modern, cost-effective
  httpApi:
    payload: '2.0'
    cors:
      allowedOrigins:
        - ${env:CORS_ORIGIN, 'http://localhost:4200'}
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-Correlation-ID
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 600
  
  # Environment variables (from .env in dev, from AWS Parameter Store in prod)
  environment:
    # APP_ENV drives validation logic in main.py (must be 'production' on Lambda)
    FLASK_ENV: production
    MONGO_URI: ${env:MONGO_URI, ''}
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY, ''}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'http://localhost:4200'}
    LOG_LEVEL: INFO
  
  # IAM Role with minimal permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: 'arn:aws:logs:*:*:*'

functions:
  # Main API Lambda function with FastAPI + Mangum
  api:
    handler: lambda_handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY
    timeout: 30
    memorySize: 512

# Packaging configuration
package:
  individually: false
  exclude:
    - node_modules/**
    - .venv/**
    - venv/**
    - .git/**
    - .pytest_cache/**
    - htmlcov/**
    - .coverage
    - tests/**
    - .env
    - .env.local
    - "*.md"
  include:
    - src/**
    - main.py
    - lambda_handler.py

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true
    strip: false
    layer: false
    useDownloadCache: false
    useStaticCache: false
    pythonBin: py -3.11
    pipCmdExtraArgs:
      - "--platform"
      - "manylinux2014_x86_64"
      - "--only-binary=:all:"
      - "--python-version"
      - "3.11"
